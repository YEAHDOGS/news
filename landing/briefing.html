<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Briefing — DOGS NEWS</title>
<meta name="description" content="The morning briefing. Top stories, ranked by readers. Prototype.">
<meta name="theme-color" content="#07090b">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://news.wearedogs.net/briefing.html">
<meta property="og:site_name" content="DOGS NEWS">
<meta property="og:type" content="website">
<meta property="og:title" content="The Briefing — DOGS NEWS">
<meta property="og:description" content="Top stories, ranked by readers.">
<meta property="og:url" content="https://news.wearedogs.net/briefing.html">
<meta property="og:image" content="https://news.wearedogs.net/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090b; --panel:#0c1013; --ink:#f5efe4; --mut:#9aa39b; --dim:#5c655f;
  --amber:#f0a53c; --line:#1a2120;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y proximity;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:#000}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.mast{height:100vh;height:100svh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(20px,6vw,48px) clamp(56px,10vh,110px);position:relative;overflow:hidden}
.mast .no{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:clamp(20px,6vw,48px);font-size:11px;letter-spacing:.24em;color:var(--dim);font-weight:600}
.mast .chip{display:inline-block;font-size:11px;letter-spacing:.22em;font-weight:700;color:#000;background:var(--amber);padding:7px 12px;border-radius:6px;margin-bottom:18px;width:max-content}
.mast h1{font-size:clamp(64px,19vw,220px);line-height:.9;font-weight:700;letter-spacing:-.01em;text-transform:uppercase}
.mast h1 em{font-style:normal;color:var(--amber)}
.mast .date{margin-top:18px;color:var(--mut);font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.mast .note{margin-top:8px;color:var(--dim);font-size:12px;letter-spacing:.06em}
.hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:22px;height:34px;border:1.5px solid var(--dim);border-radius:12px}
.hint::after{content:"";position:absolute;top:7px;left:50%;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:var(--amber);animation:drop 1.8s var(--ease) infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}70%{transform:translateY(10px);opacity:0}100%{opacity:0}}

.feed{scroll-snap-align:start;scroll-snap-stop:always;min-height:100svh;padding:calc(env(safe-area-inset-top,0px) + 64px) 0 40px}
.feed-head{padding:0 clamp(20px,6vw,48px);margin-bottom:8px}
.feed-head h2{font-size:13px;letter-spacing:.26em;color:var(--dim);font-weight:600;text-transform:uppercase}
.story{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:26px clamp(20px,6vw,48px);border-top:1px solid var(--line);scroll-snap-align:start}
.story:last-child{border-bottom:1px solid var(--line)}
.rank{font-family:"Lora",serif;font-style:italic;font-size:22px;color:var(--dim);padding-top:2px}
.kicker{font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--amber);text-transform:uppercase;margin-bottom:8px}
.headline{font-family:"Lora",serif;font-size:clamp(21px,5.8vw,32px);line-height:1.25;font-weight:500;margin-bottom:10px}
.meta{font-size:12px;color:var(--dim);letter-spacing:.08em;margin-bottom:16px}
.actions{display:flex;align-items:center;gap:8px}
.vote{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vote button{cursor:pointer;background:none;border:0;color:var(--mut);font-size:17px;line-height:1;padding:10px 13px;font-family:inherit;transition:color .15s,background .15s;min-width:44px}
.vote button:hover{color:var(--ink);background:#141a19}
.vote button.on-up{color:var(--amber)}
.vote button.on-down{color:#e11d48}
.vote .count{font-size:14px;font-weight:600;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.share{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--mut);font:inherit;font-size:13px;font-weight:600;letter-spacing:.06em;padding:11px 16px;transition:color .15s,border-color .15s}
.share:hover{color:var(--ink);border-color:var(--dim)}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#000;font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}

.fin{scroll-snap-align:start;min-height:70svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:60px clamp(20px,6vw,48px) calc(env(safe-area-inset-bottom,0px) + 40px)}
.fin img{display:block;width:min(360px,76vw);height:auto;border-radius:6px}
.fin .fine{margin-top:16px;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.fin .fine a{color:var(--mut);text-decoration:none}
.fin .fine a:hover{color:var(--ink)}
.back{margin-top:26px;color:var(--mut);font-size:13px;letter-spacing:.1em;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.back:hover{color:var(--ink);border-color:var(--amber)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .hint::after{animation:none}
  .toast{transition:none}
}
</style>
</head>
<body>

<header class="mast" aria-label="The morning briefing">
  <span class="no">DOGS NEWS · 01</span>
  <span class="chip">Prototype</span>
  <h1>The<br><em>Briefing.</em></h1>
  <p class="date" id="dateline">—</p>
  <p class="note">Top stories, ranked by readers. Sample stories below — live aggregation isn't wired yet.</p>
  <div class="hint" aria-hidden="true"></div>
</header>

<main class="feed" aria-label="Top stories">
  <div class="feed-head"><h2>Top stories</h2></div>
  <div id="stories"></div>
</main>

<footer class="fin" aria-label="About">
  <a href="https://wearedogs.net" aria-label="Made by DOGS"><img src="./img/made-by-dogs.png" alt="This product was made by DOGS" width="900" height="297"></a>
  <p class="fine"><a href="./privacy.html">Privacy</a> · <a href="./terms.html">Terms</a></p>
  <a class="back" href="./">← DOGS NEWS</a>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.getElementById("dateline").textContent =
    new Date().toLocaleDateString("en-US", { weekday:"long", month:"long", day:"numeric", year:"numeric" });

  // Sample stories — replaced by the aggregator when it goes live.
  var STORIES = [
    { id:"s1", kicker:"Tech",       head:"Open-source models close the gap on flagship AI in new benchmark round", src:"Sample wire", t:"2h ago",  base: 214 },
    { id:"s2", kicker:"Music",      head:"Vinyl pressing plants run at capacity as demand keeps climbing",          src:"Sample wire", t:"4h ago",  base: 186 },
    { id:"s3", kicker:"Cities",     head:"Overnight bus networks quietly become the fastest-growing transit option", src:"Sample wire", t:"6h ago",  base: 149 },
    { id:"s4", kicker:"Science",    head:"Astronomers catch a star swallowing a planet in real time",               src:"Sample wire", t:"8h ago",  base: 121 },
    { id:"s5", kicker:"Culture",    head:"Independent bookstores report their best year in a decade",               src:"Sample wire", t:"11h ago", base: 98 },
    { id:"s6", kicker:"Money",      head:"Small-town banks lean into local lending as big banks pull back",         src:"Sample wire", t:"13h ago", base: 64 }
  ];

  var KEY = "dogsnews-briefing-v1";
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ store = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

  var wrap = document.getElementById("stories");
  var toast = document.getElementById("toast"), toastT = 0;
  function say(msg){
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function(){ toast.classList.remove("show"); }, 1800);
  }

  function render(){
    wrap.innerHTML = "";
    STORIES.forEach(function(s, i){
      var v = store[s.id] || { up:false, down:false };
      var score = s.base + (v.up ? 1 : 0) - (v.down ? 1 : 0);
      var el = document.createElement("article");
      el.className = "story";
      el.innerHTML =
        '<span class="rank" aria-hidden="true">' + String(i+1).padStart(2,"0") + "</span>" +
        '<div>' +
          '<p class="kicker">' + s.kicker + "</p>" +
          "<h3 class='headline'>" + s.head + "</h3>" +
          '<p class="meta">' + s.src + " · " + s.t + "</p>" +
          '<div class="actions">' +
            '<div class="vote" role="group" aria-label="Vote on this story">' +
              '<button type="button" data-a="up" aria-label="Upvote" class="' + (v.up ? "on-up" : "") + '">▲</button>' +
              '<span class="count" aria-live="polite">' + score + "</span>" +
              '<button type="button" data-a="down" aria-label="Downvote" class="' + (v.down ? "on-down" : "") + '">▼</button>' +
            "</div>" +
            '<button type="button" class="share">Share</button>' +
          "</div>" +
        "</div>";
      var up = el.querySelector('[data-a="up"]'), dn = el.querySelector('[data-a="down"]');
      up.addEventListener("click", function(){ cast(s.id, "up"); });
      dn.addEventListener("click", function(){ cast(s.id, "down"); });
      el.querySelector(".share").addEventListener("click", function(){ share(s); });
      wrap.appendChild(el);
    });
  }

  function cast(id, dir){
    var v = store[id] || { up:false, down:false };
    var other = dir === "up" ? "down" : "up";
    v[dir] = !v[dir];
    if (v[dir]) v[other] = false;
    store[id] = v; save(); render();
  }

  function share(s){
    var url = "https://news.wearedogs.net/briefing.html#" + s.id;
    var data = { title: "DOGS NEWS — " + s.head, text: s.head, url: url };
    if (navigator.share) {
      navigator.share(data).catch(function(){});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function(){ say("Link copied"); }, function(){ say("Copy failed"); });
    } else {
      say("Sharing not supported here");
    }
  }

  render();
})();
</script>
</body>
</html>
